name: review

# The design system's rules are only real because this runs. Every check in tools/review.mjs
# exists because it caught something, so a red build here is the system telling the truth.
on:
  push: { branches: [main] }
  pull_request:
  workflow_dispatch:

jobs:
  review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: npm install --no-save playwright@^1.49.0
      - run: npx playwright install --with-deps chromium
      - name: Serve the site
        run: |
          python3 -m http.server 4599 --directory site &
          for i in $(seq 1 30); do curl -sf http://localhost:4599 >/dev/null && break; sleep 1; done
      - name: Automated design review
        run: node tools/review.mjs
