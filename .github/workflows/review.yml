name: review

# Four gates, in dependency order:
#   1. projections — packages/ must be regenerated from apps/site (the designers' surface)
#   2. binding     — every component class has a rule; every var() resolves to a token
#   3. types       — the react package compiles strict
#   4. design      — the 15-check review of every screen, both themes
# A red build here is the system telling the truth; never fix it by relaxing a check.
on:
  push: { branches: [main] }
  pull_request:
  workflow_dispatch:

jobs:
  review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - name: Projections in sync with apps/site
        run: node tools/build-packages.mjs --check
      - name: Component binding
        run: npm run test -w @bread/crust-react
      - name: Types
        run: npm run build -w @bread/crust-react
      - run: npx playwright install --with-deps chromium
      - name: Serve the site
        run: |
          python3 -m http.server 4599 --directory apps/site &
          for i in $(seq 1 30); do curl -sf http://localhost:4599 >/dev/null && break; sleep 1; done
      - name: Automated design review
        run: node tools/review.mjs
